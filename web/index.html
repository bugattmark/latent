<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Researcher Brief</title>
    <style>
      html,body{margin:0;padding:0;font-family:Arial, sans-serif;background:#fafafa;color:#222}
      .wrap{max-width:1200px;margin:24px auto;padding:0 16px}
      h1{margin:0 0 8px;font-size:32px}
      .bullets{padding-left:20px}
      .tabs{display:flex;gap:10px;margin:14px 0 16px;flex-wrap:wrap}
      .tab{padding:6px 10px;border:1px solid #d0d7de;border-radius:8px;cursor:pointer;background:#fff}
      .tab.active{background:#0b57d0;color:#fff;border-color:#0b57d0}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
      .card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
      .section{font-size:12px;font-weight:700;letter-spacing:.4px;color:#6a6a6a;text-transform:uppercase}
      .title{display:block;margin:6px 0 8px;text-decoration:none;color:#0b57d0;font-weight:600}
      .title:hover{text-decoration:underline}
      .row{display:flex;gap:8px;margin-top:8px}
      .take{font-style:italic;color:#444;margin-top:4px}
      button{border:1px solid #d0d7de;background:#fff;padding:6px 10px;border-radius:8px;cursor:pointer}
      button:hover{background:#f3f4f6}
      .muted{color:#777;font-size:12px}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
