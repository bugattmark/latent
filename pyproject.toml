[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researcherbrief"
version = "1.4.0"
description = "Daily AI/tech brief"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.23",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "python-dateutil>=2.9",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "openai>=1.30",
  "praw>=7.7",
  "loguru>=0.7",
]

[project.scripts]
researcherbrief-api = "researcherbrief.api.main:run"
researcherbrief-worker = "researcherbrief.worker.scheduler:run"

[tool.setuptools]
include-package-data = true

# *** The important part: only package our Python code, ignore web/data/etc. ***
[tool.setuptools.packages.find]
where = ["."]
include = ["researcherbrief*"]
exclude = ["web*", "data*", "snapshots*", "secrets*", "dist*", "build*", "node_modules*"]
